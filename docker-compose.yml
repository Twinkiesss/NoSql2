version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: library-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ETCD_NAME: etcd-node0
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://localhost:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd-node0=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster
      ALLOW_NONE_AUTHENTICATION: "yes"
    volumes:
      - etcd-data:/etcd-data

  couchdb1:
    image: couchdb:3.3
    container_name: library-couchdb1
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    ports:
      - "5984:5984"
    volumes:
      - couchdb1-data:/opt/couchdb/data

  couchdb2:
    image: couchdb:3.3
    container_name: library-couchdb2
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    ports:
      - "5985:5984"
    volumes:
      - couchdb2-data:/opt/couchdb/data

  scylla1:
    image: scylladb/scylla:5.4.4
    container_name: library-scylla1
    command: --seeds=scylla1 --smp 1 --memory 750M --overprovisioned 1 --api-address 0.0.0.0
    ports:
      - "9042:9042"
    volumes:
      - scylla1-data:/var/lib/scylla
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh $(hostname -i) 9042 -e 'DESCRIBE CLUSTER'" ]
      interval: 15s
      timeout: 10s
      retries: 30

  scylla2:
    image: scylladb/scylla:5.4.4
    container_name: library-scylla2
    command: --seeds=scylla1 --smp 1 --memory 750M --overprovisioned 1 --api-address 0.0.0.0
    depends_on:
      scylla1:
        condition: service_started
    volumes:
      - scylla2-data:/var/lib/scylla

  scylla3:
    image: scylladb/scylla:5.4.4
    container_name: library-scylla3
    command: --seeds=scylla1 --smp 1 --memory 750M --overprovisioned 1 --api-address 0.0.0.0
    depends_on:
      scylla1:
        condition: service_started
    volumes:
      - scylla3-data:/var/lib/scylla

volumes:
  postgres-data:
  etcd-data:
  couchdb1-data:
  couchdb2-data:
  scylla1-data:
  scylla2-data:
  scylla3-data:
