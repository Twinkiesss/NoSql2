server.port=8081

spring.application.name=library-events-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/library}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:library}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:library}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.cache-logging=${APP_CACHE_LOGGING:true}

etcd.endpoints=${ETCD_ENDPOINTS:http://localhost:2379}
etcd.namespace=${ETCD_NAMESPACE:library}

logging.level.root=INFO
logging.level.ru.library.event=INFO
logging.level.io.etcd.jetcd=WARN
