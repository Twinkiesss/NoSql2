server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/library
    username: library
    password: library
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

etcd:
  endpoints: http://localhost:2379
  namespace: library

couchdb:
  primary-url: http://localhost:5984
  replica-url: http://localhost:5985
  username: admin
  password: admin
  database: events
  cache-ttl-seconds: 60
  initialize: true

app:
  cache-logging: true
